<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirect</title>
    <style media="screen">
      body {
        background: #eceff1;
        color: rgba(0, 0, 0, 0.87);
        font-family: Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 0;
      }
    </style>
    <script
      src="https://cdn.ravenjs.com/3.26.4/raven.min.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div
      style="
        display: flex;
        justify-content: center;
        align-items: center;
        height: 400px;
      "
    >
      <h4 style="text-align: center">Redirecting...</h4>
    </div>

    <script>
      function parseUrl(url) {
        var parts = url.split("?");
        if (parts.length === 1) {
          return {
            base: parts[0],
            query: {},
          };
        }
        var params = parts[1].split("&");
        var query = {};
        for (var i = 0; i < params.length; i++) {
          var param = params[i];
          var paramParts = param.split("=");
          query[paramParts[0]] = decodeURI(paramParts[1]);
        }
        return {
          base: parts[0],
          query: query,
        };
      }

      function createUrl(base, query) {
        var url = base;
        var keys = Object.keys(query);
        var added = false;
        for (var i = 0; i < keys.length; i++) {
          var key = keys[i];
          var value = query[key];
          if (added) {
            url = url + "&";
          } else {
            url = url + "?";
            added = true;
          }
          url = url + key + "=" + value;
        }
        return url;
      }

      Raven.config("https://1b8a4f479bfe4f3894cfe4d8213c16eb@o451487.ingest.sentry.io/5449198").install();
      
      Raven.context(function() {
        Raven.captureMessage('bueno' + window.location.href);
        document.addEventListener("DOMContentLoaded", function () {
          try {
            


            var url = parseUrl(window.location.href);

            var redirect = url.query["beast_redirect"];
            if (!redirect) {
              throw new Error("Beast redirect must be defined");
            }
            var redirectUrl = parseUrl(redirect);

            var checkoutStatus = url.query["collection_status"];
            var status = "";
            switch (checkoutStatus) {
              case "null":
                status = "";
                break;
              case "pending":
                status = "pending";
                break;
              case "in_process":
                status = "in_process";
                break;
              case "approved":
              case undefined: // ok redirect with webpay debito
                status = "approved";
                break;
              case "rejected":
                status = "rejected";
                break;
              default:
                status = "not_mapped";
                break;
            }

            window.location.replace(
              createUrl(redirectUrl.base, {
                status: status,
                checkout: JSON.stringify(url.query),
              })
            );
          } catch (e) {
            Raven.captureException(e);
          }
        });
      });
      
    </script>
  </body>
</html>
