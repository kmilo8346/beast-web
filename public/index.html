<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- favicon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./favicon-16x16.png"
    />
    <link rel="manifest" href="./site.webmanifest" />

    <!-- Primary Meta Tags -->
    <title>Shop Shop</title>
    <meta name="title" content="Shop Shop" />
    <meta
      name="description"
      content="Shop Shop es una herramienta para comprar y vender productos cerca de ti. Descubre lo que venden tus vecinos y más, siempre con despacho gratis. "
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shopshopapp.cl/" />
    <meta property="og:title" content="Shop Shop" />
    <meta
      property="og:description"
      content="Shop Shop es una herramienta para comprar y vender productos cerca de ti. Descubre lo que venden tus vecinos y más, siempre con despacho gratis. "
    />
    <meta
      property="og:image"
      content="https://res.cloudinary.com/firedevs/image/upload/v1600886857/beast/assets/graphic_d0m3ms.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://shopshopapp.cl/" />
    <meta property="twitter:title" content="Shop Shop" />
    <meta
      property="twitter:description"
      content="Shop Shop es una herramienta para comprar y vender productos cerca de ti. Descubre lo que venden tus vecinos y más, siempre con despacho gratis. "
    />
    <meta
      property="twitter:image"
      content="https://res.cloudinary.com/firedevs/image/upload/v1600886857/beast/assets/graphic_d0m3ms.png"
    />

    <link rel="stylesheet" href="./assets/main.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap"
      rel="stylesheet"
    />
    <title>Shop Shop</title>
    <style media="screen"></style>
  </head>
  <body>
    <div class="align-center">
      <img src="../assets/images/shop-shop-logo.svg" alt="Shop Shop" />
    </div>
    <div>
      <h2 class="align-center">Descarga Shop Shop</h2>
    </div>
    <div class="downloads">
      <div class="download-link">
        <a
          href="https://apps.apple.com/us/app/id1531418420"
          style="border: none; outline: none"
        >
          <img
            src="./assets/images/apple-store.svg"
            alt="Shop Shop para iPhone"
          />
        </a>
      </div>
      <div>
        <a
          href="http://play.google.com/store/apps/details?id=com.firedevs.beast"
        >
          <img
            src="./assets/images/google-play.svg"
            alt="Shop Shop para Android"
          />
        </a>
      </div>
    </div>
    <div class="align-center">
      <img
        src="./assets/images/phones-view.png"
        alt="Compra y vende a tus vecinos"
        class="full-width-img"
      />
    </div>
  </body>
</html>
